<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="m-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Gráfica ascendente formando la M -->
  <path d="M 20 90 L 40 40 L 60 70 L 80 30 L 100 15" 
        fill="none" 
        stroke="url(#m-grad)" 
        stroke-width="14" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)"/>
        
  <!-- Punto final destacando el crecimiento -->
  <circle cx="100" cy="15" r="9" fill="#34d399" filter="url(#glow)"/>
</svg>
