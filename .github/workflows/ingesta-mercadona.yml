name: Ingesta incremental Mercadona

on:
  repository_dispatch:
    types: [mercadona_csv_ready]
  workflow_dispatch:
    inputs:
      csv_name:
        description: "Nombre opcional del CSV a procesar"
        required: false

permissions:
  contents: write

jobs:
  ingesta:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MercaIntelligence
        uses: actions/checkout@v4
        with:
          path: mercaintelligence
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0 # Es importante mantener el 0 para tener el histórico al sincronizar

      - name: Checkout WebScraping_Mercadona
        uses: actions/checkout@v4
        with:
          repository: danielpmprojects/WebScraping_Mercadona
          path: scraper
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        working-directory: mercaintelligence
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Localizar CSV
        id: csv
        shell: bash
        run: |
          if [ -n "${{ github.event.client_payload.csv_name }}" ]; then
            CSV="scraper/data/${{ github.event.client_payload.csv_name }}"
          elif [ -n "${{ inputs.csv_name }}" ]; then
            CSV="scraper/data/${{ inputs.csv_name }}"
          else
            CSV=$(ls -t scraper/data/*_Mercadona_*.csv 2>/dev/null | head -n 1)
          fi

          if [ -z "$CSV" ]; then
            echo "Error: No CSV file found in scraper/data/"
            exit 1
          fi

          test -f "$CSV" || { echo "Error: CSV file not found at $CSV"; exit 1; }
          echo "csv_path=$CSV" >> "$GITHUB_OUTPUT"
          echo "CSV seleccionado: $CSV"

      - name: Ejecutar ingesta incremental
        working-directory: mercaintelligence
        env:
          INGESTA_SKIP_ES: "1"
        run: |
          python src/etl/ingesta_incremental.py --csv "../${{ steps.csv.outputs.csv_path }}"

      - name: Commit datos actualizados
        working-directory: mercaintelligence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -f data/raw data/processed data/state

          if git diff --cached --quiet; then
            echo "No hay cambios que commitear."
            # No salimos con exit 0 completo si queremos que siempre sincronice por seguridad,
            # pero asumimos que si no hay cambios, no hace falta forzar push a HF.
            # Aun así, dejamos que continúe el workflow si quieres asegurar el despliegue.
          else
            git commit -m "chore(datos): ingesta incremental Mercadona [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          fi

      - name: Sincronizar hacia Hugging Face Spaces
        working-directory: mercaintelligence
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Instalar la librería huggingface_hub para sincronización directa
          pip install huggingface_hub
          
          # Subir la aplicación y datos de manera directa vía API HTTP (con soporte automático para LFS y eliminación de archivos obsoletos en el remoto)
          huggingface-cli upload danielpmdev/mercaintelligence-backend . --repo-type=space --token=$HF_TOKEN --delete="*" --exclude=".git/*" --exclude=".github/*" --exclude="frontend/*" --exclude="notebooks/*" --exclude="dashboards/*" --exclude="docs/*" --exclude="*.ipynb" --exclude="**/__pycache__/*" --exclude="*.pyc"